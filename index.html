<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, intial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="clima-container">
  
  <div class="clima-header">
  <div class="cidade-nome">長野県上田市</div>
<p class="cidade-sub">Ueda, Nagano -Japão</p>
  </div>


<div class="temp-principal-box">
  <div class="icone-tempo">❄️</div>
<div class="graus-box">
  <span class="numero-graus">-2</span>
<span class="unidade">°C</span>
</div>
<p class="condicao-texto">雪</p>
</div>

<div class="grid-clima-info">
  <div class="info-card">
    <span class="info-label">風</span>
<span class="info-valor">12 km/h</span>
  </div>
<div class="info-card">
  <span class="info-label">湿度</span>
<span class="info-valor">78%</span>
</div>
</div>

<div class="alerta-neve-box">
  <span>"大雪警報"</span>
</div>
</div>

</body>
</html>
